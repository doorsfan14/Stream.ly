<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Videos, creators, and ideas worth your time.">
<title>Stream.ly</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand-area">
    <button class="icon-button menu-toggle" id="menuToggle" aria-label="Toggle navigation"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="#" aria-label="Stream.ly home"><span class="brand-mark"><span></span><span></span><span></span></span><span>Stream.ly</span></a>
  </div>
  <form class="search-form" id="searchForm" role="search"><label class="sr-only" for="searchInput">Search</label><input id="searchInput" type="search" placeholder="Search" autocomplete="off"><button aria-label="Search" type="submit"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg></button></form>
  <div class="top-actions">
    <button class="create-button" id="createButton"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></button>
    <button class="icon-button notification-button" id="notificationButton" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><i></i></button>
    <button class="profile-button" id="profileButton" aria-label="Open profile menu"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=96&q=80" alt=""></button>
  </div>
</header>
<aside class="sidebar" id="sidebar">
  <nav class="main-nav" aria-label="Main navigation">
    <button class="nav-item active" data-nav="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-item" data-nav="Explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2.2 4.8-4.8 2.2 2.2-4.8z"/></svg><span>Explore</span></button>
    <button class="nav-item" data-nav="Following"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM19 8v6M22 11h-6"/></svg><span>Following</span></button>
    <button class="nav-item" data-nav="Live"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="m10 10 5 2.5-5 2.5z"/></svg><span>Live</span></button>
  </nav>
  <div class="sidebar-rule"></div>
  <div class="sidebar-label">You</div>
  <nav class="main-nav" aria-label="Your library">
    <button class="nav-item" data-nav="Library"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 4v16M12 8h4M12 12h4M12 16h4"/></svg><span>Library</span></button>
    <button class="nav-item" data-nav="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>History</span></button>
    <button class="nav-item" data-nav="Watch later"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Watch later</span></button>
  </nav>
  <div class="sidebar-rule"></div><div class="sidebar-label">Subscriptions</div>
  <div class="creator-list">
    <button class="creator-link" data-creator="Maya Chen"><img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=80&q=80" alt=""><span>Maya Chen</span></button>
    <button class="creator-link" data-creator="Frame by Frame"><img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=80&q=80" alt=""><span>Frame by Frame</span></button>
    <button class="creator-link" data-creator="Theo's Kitchen"><img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=80&q=80" alt=""><span>Theo's Kitchen</span></button>
    <button class="creator-link" data-creator="Northbound"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=80&q=80" alt=""><span>Northbound</span></button>
  </div>
</aside>
<main class="main-content" id="mainContent">
  <section class="welcome-row"><div><h1 id="feedTitle">Picked for you</h1><p id="feedSubtitle">Videos you'll want to watch.</p></div><span id="dateStamp" hidden></span><button class="text-button" id="refreshButton" aria-label="Refresh feed"><svg viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5.6 9A7 7 0 0 1 18 6l2 6M4 12l2 6a7 7 0 0 0 12.4-3"/></svg></button></section>
  <section class="featured-section" aria-label="Featured video"><button class="featured" id="featuredVideo" data-video="0">Featured video</button></section>
  <div class="topic-row" id="topicRow" aria-label="Video categories">
    <button class="topic active" data-topic="For you">All</button><button class="topic" data-topic="Design">Design</button><button class="topic" data-topic="Music">Music</button><button class="topic" data-topic="Gaming">Gaming</button><button class="topic" data-topic="Food">Food</button><button class="topic" data-topic="Outdoors">Outdoors</button><button class="topic" data-topic="Live">Live now <span class="topic-live-dot"></span></button>
  </div>
  <section class="feed-section"><div class="video-grid" id="videoGrid"></div><div class="empty-state" id="emptyState" hidden><span class="empty-symbol">⌕</span><h3>No videos found</h3><p>Try another search or topic.</p><button class="outline-button" id="clearSearch">Clear search</button></div></section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="playerModal" hidden><section class="player-dialog" role="dialog" aria-modal="true" aria-labelledby="playerTitle"><button class="modal-close" data-close="playerModal" aria-label="Close player">×</button><div class="player-stage" id="playerStage"></div><div class="player-info"><div><p class="eyebrow" id="playerCategory">VIDEO</p><h2 id="playerTitle"></h2><p id="playerMeta"></p></div><div class="player-actions"><button class="outline-button" id="likeButton"><span>♡</span> Like</button><button class="outline-button" id="saveButton"><span>＋</span> Save</button></div></div><p class="player-description" id="playerDescription"></p><div class="player-creator" id="playerCreator"></div></section></div>
<div class="modal-backdrop" id="createModal" hidden><section class="create-dialog" role="dialog" aria-modal="true" aria-labelledby="createTitle"><button class="modal-close" data-close="createModal" aria-label="Close upload dialog">×</button><h2 id="createTitle">Upload video</h2><p class="create-intro">Share a video with your feed.</p><form id="uploadForm"><label class="upload-drop" for="videoFile"><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></svg><strong id="fileLabel">Choose a video</strong><span>MP4, MOV, or WebM</span><input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm,video/*" required></label><label class="field-label" for="videoTitleInput">Title</label><input class="text-field" id="videoTitleInput" maxlength="100" placeholder="Add a title" required><label class="field-label" for="videoCategoryInput">Category</label><select class="text-field" id="videoCategoryInput"><option>Design</option><option>Music</option><option>Gaming</option><option>Food</option><option>Outdoors</option><option>Other</option></select><button class="publish-button" type="submit">Upload</button><p class="upload-note">Uploads are available in this browser session. Persistent publishing needs a video-hosting backend.</p></form></section></div>
<div class="popover-menu" id="profileMenu" hidden><button data-menu-action="Your channel">Your channel</button><button data-menu-action="Settings">Settings</button><button data-menu-action="Sign in">Sign in</button></div>
<script src="app.js"></script>
</body></html>
