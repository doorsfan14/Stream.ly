<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f7">
<meta name="description" content="Watch videos on Stream.ly.">
<title>Stream.ly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div class="brand-area">
    <button class="icon-button menu-toggle" id="menuToggle" aria-label="Toggle navigation"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <a class="brand" href="#" aria-label="Stream.ly home"><span class="brand-mark"><svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6z"/></svg></span><span>Stream.ly</span></a>
  </div>
  <form class="search-form" id="searchForm" role="search"><label class="sr-only" for="searchInput">Search</label><input id="searchInput" type="search" placeholder="Search" autocomplete="off"><button type="submit" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></svg></button></form>
  <div class="top-actions">
    <button class="create-button" id="createButton"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></button>
    <button class="icon-button" id="notificationButton" aria-label="Notifications"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></button>
    <button class="profile-button" id="profileButton" aria-label="Open account menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></button>
  </div>
</header>
<aside class="sidebar" id="sidebar">
  <nav class="main-nav" aria-label="Main navigation">
    <button class="nav-item active" data-nav="Home"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="nav-item" data-nav="Explore"><svg viewBox="0 0 24 24"><path d="m12 3 2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg><span>Explore</span></button>
    <button class="nav-item" data-nav="Following"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span>Subscriptions</span></button>
  </nav>
  <div class="sidebar-rule"></div>
  <nav class="main-nav" aria-label="Library">
    <button class="nav-item" data-nav="Library"><svg viewBox="0 0 24 24"><path d="M4 5h16v15H4zM8 3v4M16 3v4"/></svg><span>You</span><svg class="nav-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
    <button class="nav-item" data-nav="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5M12 7v5l3 2"/></svg><span>History</span></button>
    <button class="nav-item" data-nav="Watch later"><svg viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg><span>Watch later</span></button>
  </nav>
</aside>
<main class="main-content" id="mainContent">
  <div class="topic-row" id="topicRow" aria-label="Video categories">
    <button class="topic active" data-topic="For you">All</button><button class="topic" data-topic="Music">Music</button><button class="topic" data-topic="Gaming">Gaming</button><button class="topic" data-topic="Design">Design</button><button class="topic" data-topic="Food">Food</button><button class="topic" data-topic="Outdoors">Travel & outdoors</button><button class="topic" data-topic="Live">Live</button>
  </div>
  <section class="feed-section">
    <div class="feed-heading"><h1 id="feedTitle">Recommended</h1><span id="dateStamp" class="date-stamp"></span><p id="feedSubtitle" hidden></p></div>
    <div class="video-grid" id="videoGrid"></div>
    <div class="empty-state" id="emptyState" hidden><h3>No videos found</h3><p>Try a different search or category.</p><button class="outline-button" id="clearSearch">Clear search</button></div>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="modal-backdrop" id="playerModal" hidden><section class="player-dialog" role="dialog" aria-modal="true" aria-labelledby="playerTitle"><button class="modal-close" data-close="playerModal" aria-label="Close player">×</button><div class="player-stage" id="playerStage"></div><div class="player-info"><div><p class="eyebrow" id="playerCategory">VIDEO</p><h2 id="playerTitle"></h2><p id="playerMeta"></p></div><div class="player-actions"><button class="outline-button" id="likeButton"><span>♡</span> Like</button><button class="outline-button" id="saveButton"><span>＋</span> Save</button></div></div><p class="player-description" id="playerDescription"></p><div class="player-creator" id="playerCreator"></div></section></div>
<div class="modal-backdrop" id="createModal" hidden><section class="create-dialog" role="dialog" aria-modal="true" aria-labelledby="createTitle"><button class="modal-close" data-close="createModal" aria-label="Close upload dialog">×</button><h2 id="createTitle">Upload video</h2><form id="uploadForm"><label class="upload-drop" for="videoFile"><svg viewBox="0 0 24 24"><path d="M12 16V4m-5 5 5-5 5 5M4 16v4h16v-4"/></svg><strong id="fileLabel">Select a video file</strong><span>MP4, MOV, or WebM</span><input id="videoFile" type="file" accept="video/mp4,video/quicktime,video/webm,video/*" required></label><label class="field-label" for="videoTitleInput">Title</label><input class="text-field" id="videoTitleInput" maxlength="100" placeholder="Add a title" required><label class="field-label" for="videoCategoryInput">Category</label><select class="text-field" id="videoCategoryInput"><option>Gaming</option><option>Music</option><option>Design</option><option>Food</option><option>Outdoors</option><option>Other</option></select><button class="publish-button" type="submit">Publish</button><p class="upload-note">Videos are available in this browser session only.</p></form></section></div>
<div class="popover-menu" id="profileMenu" hidden><button data-menu-action="Your channel">Your channel</button><button data-menu-action="Settings">Settings</button><button data-menu-action="Sign in">Sign in</button></div>
<script src="app.js"></script>
</body>
</html>
